spring:
  application:
    name: vortex-cuda-server
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${VORTEX_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Vortex CUDA
    stage: M17
    description: GPU-accelerated exact vector search REST service

vortex:
  limits:
    max-vector-count: ${VORTEX_MAX_VECTOR_COUNT:100000}
    max-dimension: ${VORTEX_MAX_DIMENSION:4096}
    max-index-elements: ${VORTEX_MAX_INDEX_ELEMENTS:2000000}
